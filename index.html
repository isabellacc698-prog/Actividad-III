<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nix - Mujer Águila</title>

    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <!-- Encabezado -->
    <header>
        <div class="logo">NIX</div>

        <!-- Menú -->
        <nav>
            <a href="#inicio">Inicio</a>
            <a href="#historia">Historia</a>
            <a href="#contacto">Contacto</a>
        </nav>
    </header>

    <!-- Contenido -->
    <main id="inicio">

        <h1 id="titulo">Nix, la Mujer Águila</h1>

        <p>
            Nix es una mujer fuerte y valiente que representa
            la libertad, la fuerza y el poder del águila.
        </p>

        <!-- Foto -->
        <img id="imagen" src="nix.jpg" alt="Nix, mujer águila">

        <!-- Historia -->
        <section id="historia">
            <h2>La historia de Nix</h2>

            <p>
                Nix tiene la capacidad de volar y proteger
                a quienes lo necesitan.
            </p>

            <button id="boton">Conocer más</button>
        </section>

        <!-- Formulario -->
        <section id="contacto">
            <h2>Contacto</h2>

            <form id="formulario">
                <input id="nombre" type="text" placeholder="Tu nombre">
                <input type="email" placeholder="Tu correo">

                <button type="submit">Enviar</button>
            </form>
        </section>

    </main>

    <!-- Pie de página -->
    <footer>
        <p>© 2026 Nix - Mujer Águila</p>
    </footer>

    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
